    Experience:
      - company: The Pennsylvania State University
        position: Graduate Research Assistant
        location: State College, PA
        url: https://sites.psu.edu/sengupta/
        start_date: 2024-08-01
        end_date: present
        highlights:
          - "Developed STAR ([arXiv:2607.15415](https://arxiv.org/abs/2607.15415)): a retraining-based repair method for AI models deployed on memory chips that develop permanent hardware faults, requiring no additional hardware or fault localization. Before deployment, a compact snapshot of the healthy model's internal states is stored (20x-191x smaller than a full checkpoint); after faults appear, this snapshot guides retraining to recover accuracy without any knowledge of which memory cells are broken. Proved the augmented training dynamics retain fixed-point convergence guarantees under Lipschitz-continuity conditions. Achieves +59% accuracy recovery over standard retraining on CNN and MLP benchmarks."
          - "Working on scaling Equilibrium Propagation (EP), a local learning rule that computes weight updates without a backward pass, to deeper network architectures and developing methods to improve its computational efficiency; also investigating its theoretical foundations, including gradient-equivalence to backpropagation in appropriate limits, with a neuroscience-inspired angle drawing on glial-cell-mediated regulation of synaptic plasticity."
          - "Built PyTorch/CUDA training pipelines for fault-injection experiments: simulating permanent memory failures at rates up to 90%, convergence diagnostics, and sweeps across MLP and CNN architectures."

      - company: National Remote Sensing Centre, ISRO
        position: Research Intern
        location: New Delhi, India
        start_date: 2022-05-01
        end_date: 2022-12-01
        highlights:
          - "Supervisor: Ms. Khushboo Mirza"
          - "Built an end-to-end ML pipeline (Python, scikit-learn) for industrial site detection in multispectral Sentinel-2 satellite imagery, achieving 96.4% classification accuracy via discriminative multi-band spectral feature engineering."

