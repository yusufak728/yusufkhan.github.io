    Projects:
      - name: "STAR: Keeping AI Models Reliable When Hardware Memory Fails"
        date: 2026-07-01
        url: https://arxiv.org/abs/2607.15415
        summary: "Graduate Research Project, Penn State"
        highlights:
          - "Designed an astrocyte-inspired repair mechanism for Equilibrium Propagation-trained networks under permanent stuck-at hardware faults; recovered +59% accuracy on CNN/CIFAR-10 and +52% on MLP/MNIST over standard retraining across fault rates up to 90%, using repair signals 20x-191x smaller than a full model checkpoint, with no fault localization required."

      - name: "Neuromorphic RAG System"
        summary: "Personal Project"
        highlights:
          - "Built a retrieval-augmented generation pipeline over a corpus of ML research papers, combining Sentence Transformers for dense embeddings, FAISS for semantic search, and Flan-T5 for grounded answer generation; implemented full ingestion pipeline from PDF extraction through FAISS index construction."

